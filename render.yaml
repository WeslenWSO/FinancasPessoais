services:
  - type: web
    name: financas-pessoais
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: financas-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        value: Admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@financaspessoal.local
      - key: WEB_CONCURRENCY
        value: "2"

databases:
  - name: financas-db
    plan: free
