{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a1628">
  <title>{% block title %}Finanças Pessoais{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'financas/css/app.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="auth-page">
  <div class="auth-bg" style="background-image:url('{% static 'financas/img/login-bg.png' %}');"></div>
  <div class="auth-bg-overlay"></div>
  <div class="auth-ios-device">
    <div class="auth-ios-status" aria-hidden="true">
      <span class="auth-ios-status-time">9:41</span>
      <span class="auth-ios-status-icons">
        <span class="auth-ios-signal"></span>
        <span class="auth-ios-wifi"></span>
        <span class="auth-ios-battery"></span>
      </span>
    </div>
    {% block content %}{% endblock %}
    <div class="auth-ios-home-indicator" aria-hidden="true"></div>
  </div>
</body>
</html>
