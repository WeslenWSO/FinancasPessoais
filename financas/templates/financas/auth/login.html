{% extends 'financas/auth/auth_base.html' %}
{% block title %}Entrar — Finanças Pessoais{% endblock %}
{% block content %}
<main class="auth-ios">
  <div class="auth-ios-header">
    <div class="auth-ios-icon" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="16" fill="url(#g)"/>
        <path d="M20 28h24v4H20v-4zm0 8h16v4H20v-4zm4-16h16a8 8 0 0 1 0 16H24V20z" fill="#fff" fill-opacity=".95"/>
        <defs><linearGradient id="g" x1="8" y1="4" x2="56" y2="60"><stop stop-color="#34d399"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs>
      </svg>
    </div>
    <h1>Finanças Pessoais</h1>
    <p>Entre para continuar</p>
  </div>

  <div class="auth-ios-card">
    {% if form.errors %}
    <div class="auth-ios-alert">Usuário ou senha inválidos.</div>
    {% endif %}

    <form method="post" class="auth-ios-form">
      {% csrf_token %}
      <div class="auth-ios-group">
        <label class="auth-ios-field">
          <span>Usuário</span>
          <input type="text" name="username" autocomplete="username" autocapitalize="none" required
                 value="{{ form.username.value|default:'' }}" placeholder="Seu usuário">
        </label>
        <label class="auth-ios-field">
          <span>Senha</span>
          <input type="password" name="password" autocomplete="current-password" required placeholder="Sua senha">
        </label>
      </div>

      <button type="submit" class="auth-ios-btn">Entrar</button>
    </form>
  </div>

  <p class="auth-ios-footer">
    Não tem conta? <a href="{% url 'register' %}">Criar conta</a>
  </p>
</main>
{% endblock %}
